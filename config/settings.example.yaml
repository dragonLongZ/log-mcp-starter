# 部署设置示例 —— 复制为 config/settings.yaml 后按需修改。
#
# 这里只放部署期常量（跳板机地址、监听端口、心跳、日志时区）。
# 资产与自定义命令白名单在运行时数据库里（见 storage.db_path），由网页 /dashboard 维护，
# 数据库文件本身不进版本库。

jumpserver:
  host: "jumpserver.example.com"
  port: 2222
  # 仅监听本机时用 127.0.0.1；要让别人访问网页仪表盘才改成 0.0.0.0（务必配合防火墙）。
  bind_host: "127.0.0.1"
  bind_port: 8765
  # 启动时自动发起认证的资产名列表（可选）。
  auto_connect: []
  # 应用层心跳间隔（分钟，1-60）。
  keepalive_interval_minutes: 25

mcp_server:
  bind_host: "0.0.0.0"
  bind_port: 8000

log_timezone: "Asia/Shanghai"

storage:
  # 相对路径按仓库根解析；systemd 建议用绝对路径，如 /var/lib/logmcp/logmcp.db
  db_path: "data/logmcp.db"

dashboard:
  # 关掉后网页只能查看状态，所有写接口返回 403。
  write_enabled: true
