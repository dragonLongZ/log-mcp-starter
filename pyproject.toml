[project]
name = "log-mcp-starter"
version = "0.1.0"
description = "A local read-only log MCP backed by a manually authenticated JumpServer SSH session"
requires-python = ">=3.11"
dependencies = [
  "asyncssh>=2.20,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "mcp>=1.28,<2",
  "PyYAML>=6,<7",
  "uvicorn>=0.34,<1",
  "tzdata>=2025.1",
  "safecmd>=0.1.16",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
